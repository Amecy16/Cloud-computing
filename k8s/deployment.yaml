apiVersion: apps/v1
kind: Deployment
metadata:
  name: storingsmelder
  labels:
    app: storingsmelder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storingsmelder
  template:
    metadata:
      labels:
        app: storingsmelder
    spec:
      containers:
        - name: storingsmelder
          image: ghcr.io/amecy16/storingsmelder:1.1

          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:geheim123@db:5432/storingsmelder"